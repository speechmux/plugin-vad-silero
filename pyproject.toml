[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "speechmux-plugin-vad-silero"
version = "0.1.0"
description = "SpeechMux VAD Plugin — Silero VAD engine"
requires-python = ">=3.10"
dependencies = [
    "speechmux-plugin-vad>=0.0.0",
    "numpy>=1.24",
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "silero-vad>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.entry-points."speechmux.vad_engine"]
silero = "speechmux_plugin_vad_silero.silero_engine:SileroVADEngine"

[tool.hatch.build.targets.wheel]
packages = ["src/speechmux_plugin_vad_silero"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true
